schema_version: 1
project:
  name: Bread Pitt
  slug: bread-pitt
  description: Track Bread Pitt's starter history, recipes, bakes, observations, and
    lessons learned.

workflow:
  journal:
    policy: event-driven

validation:
  commands:
    - pnpm run build
    - git diff --check

framework:
  name: Abbey
  schema_version: 1
paths:
  planning: docs/planning
  session_updates: docs/session-updates
  journal: content/journal

site:
  source: site
  build:
    method: static
