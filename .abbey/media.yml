schema_version: 1

rename_exports:
  caption_tag: XMP-dc:Description
  date_tag: DateTimeOriginal
  filename_template: "{caption_slug}-{capture_date}{sequence}"
  manifest: .abbey-rename-manifest.json
  extensions:
    - .jpg
    - .jpeg
    - .heic
    - .png
    - .tif
    - .tiff

publish:
  bake001:
    source: working/media/bakes/2026/bake001
    destination: public/images/bakes/2026/bake001
    intake_manifest: content/bakes/2026/bake001/media-intake.json
    manifest: content/bakes/2026/bake001/media-publication.json
    output_format: jpg
    max_edge: 2000
    quality: 85

  bake002:
    source: working/media/bakes/2026/bake002
    destination: public/images/bakes/2026/bake002
    intake_manifest: content/bakes/2026/bake002/media-intake.json
    manifest: content/bakes/2026/bake002/media-publication.json

  bake003:
    source: working/media/bakes/2026/bake003
    destination: public/images/bakes/2026/bake003
    intake_manifest: content/bakes/2026/bake003/media-intake.json
    manifest: content/bakes/2026/bake003/media-publication.json
    output_format: jpg
    max_edge: 2000
    quality: 85

  starter_cycle_pilot:
    source: media/prepared/starter-cycle-pilot
    destination: public/images/starter-cycles
    intake_manifest: media/prepared/starter-cycle-pilot/intake.json
    manifest: generated/media/starter-cycle-pilot.json
    output_format: jpg
    max_edge: 2000
    quality: 85
